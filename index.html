  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ref=\"#about\" style=\"text-decoration:none;color:#a3a29c\">About<\u002Fa>\n    <a href=\"#intyga\" style=\"text-decoration:none;color:#a3a29c\">INTYGA<\u002Fa>\n    <a href=\"#protocols\" style=\"text-decoration:none;color:#a3a29c\">Protocols<\u002Fa>\n    <a href=\"#skills\" style=\"text-decoration:none;color:#a3a29c\">Skills<\u002Fa>\n    <a href=\"#writing\" style=\"text-decoration:none;color:#a3a29c\">Writing<\u002Fa>\n    <a href=\"#contact\" style=\"text-decoration:none;color:#9696ee\">Contact<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<section id=\"top\" data-screen-label=\"Hero\" style=\"display:flex;flex-wrap:wrap;gap:clamp(40px,5vw,72px);align-items:center;padding:clamp(56px,9vw,112px) 0 clamp(64px,9vw,112px)\">\n  <div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:#a3a29c;display:flex;gap:10px;align-items:center\">\n      <span style=\"width:8px;height:8px;border-radius:50%;background:oklch(0.78 0.15 150);flex:none;animation:pulse 2.4s ease-in-out infinite\"><\u002Fspan>\n      Founder &amp; Lead Architect, INTYGA · Falun, Sweden\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(44px,6.4vw,86px);line-height:1.0;letter-spacing:-0.025em;margin:0;text-wrap:balance\">I build ways to prove a human <em style=\"color:#9696ee\">authorized<\u002Fem> something.<\u002Fh1>\n    <p style=\"font-size:clamp(18px,1.6vw,21px);color:#b9b8b2;margin:0;max-width:34em;text-wrap:pretty\">Software engineer working on human authorization for automated systems. I design protocols that bind a person’s signature to one exact action, so the service about to execute can verify it itself, offline.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding-top:4px\">\n      <a href=\"#contact\" style=\"text-decoration:none;background:#fafafa;color:#0d0d0f;padding:12px 20px;font-size:15px;font-weight:600\" style-hover=\"background:#9696ee;color:#0d0d0f\">Get in touch<\u002Fa>\n      <a href=\"https://github.com/slaxxarn\" style=\"text-decoration:none;border:1px solid #3a3a40;padding:11px 20px;font-size:15px;font-weight:500\" style-hover=\"border-color:#9696ee\">GitHub ↗<\u002Fa>\n      <a href=\"https://www.linkedin.com/search/results/people/?keywords=Christian%20Janbjer\" style=\"text-decoration:none;border:1px solid #3a3a40;padding:11px 20px;font-size:15px;font-weight:500\" style-hover=\"border-color:#9696ee\">LinkedIn ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1 1 400px;min-width:0;display:flex;flex-direction:column;border:1px solid #2c2c32;background:#141417;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #2c2c32;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#a3a29c;text-transform:uppercase;letter-spacing:0.06em\">\n      <span>Try it · real P-256 check<\u002Fspan>\n      <sc-if value=\"{{ pending }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#a3a29c;animation:pulse 1s ease-in-out infinite\">● verifying…<\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ valid }}\"><span style=\"color:oklch(0.78 0.15 150)\">● signature valid<\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ invalid }}\"><span style=\"color:oklch(0.68 0.19 25)\">● signature invalid<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <pre style=\"margin:0;padding:20px 18px 14px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;line-height:1.75;color:#cfcec8;white-space:pre-wrap;overflow-wrap:anywhere\"><span style=\"color:#77766f\">{<\u002Fspan>\n  <span style=\"color:#8fb4d9\">\"actionType\"<\u002Fspan>: <span style=\"color:#d9c08f\">\"database.drop_table\"<\u002Fspan>,\n  <span style=\"color:#8fb4d9\">\"target\"<\u002Fspan>: <span style=\"color:#d9c08f\">\"acme-prod-db\"<\u002Fspan>,\n  <span style=\"color:#8fb4d9\">\"params\"<\u002Fspan>: <span style=\"color:#77766f\">{<\u002Fspan>\n    <span style=\"color:#8fb4d9\">\"table\"<\u002Fspan>: <sc-if value=\"{{ notInvalid }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#d9c08f\">\"{{ table }}\"<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ invalid }}\"><span style=\"color:oklch(0.68 0.19 25);background:oklch(0.68 0.19 25 / 0.14);padding:1px 4px\">\"{{ table }}\"<\u002Fspan><\u002Fsc-if>\n  <span style=\"color:#77766f\">}<\u002Fspan>,\n  <span style=\"color:#8fb4d9\">\"requirement\"<\u002Fspan>: <span style=\"color:#77766f\">{<\u002Fspan> <span style=\"color:#8fb4d9\">\"requiredApprovals\"<\u002Fspan>: <span style=\"color:#c99fd9\">2<\u002Fspan> <span style=\"color:#77766f\">}\n}<\u002Fspan><\u002Fpre>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 18px 16px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#77766f;margin-right:4px\">table →<\u002Fspan>\n      <sc-for list=\"{{ tables }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ t.pick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 10px;cursor:pointer;background:transparent;color:#cfcec8;border:1px solid #3a3a40\" style-hover=\"border-color:#9696ee;color:#f4f4f5\">{{ t.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-top:1px solid #2c2c32;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#77766f;overflow-wrap:anywhere\">\n      <div>key <span style=\"color:#a3a29c\">ECDSA P-256 · generated in your browser<\u002Fspan><\u002Fdiv>\n      <div>signature <span style=\"color:#a3a29c\">{{ sig }}<\u002Fspan><\u002Fdiv>\n      <div>request sha256 <sc-if value=\"{{ notInvalid }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:oklch(0.78 0.15 150)\">{{ digest }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ invalid }}\"><span style=\"color:oklch(0.68 0.19 25)\">{{ digest }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;color:#77766f\"><span>Signed once for payments_2024. Every click re-verifies.<\u002Fspan><button sc-camel-on-click=\"{{ toggleBytes }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 9px;cursor:pointer;background:transparent;color:#9696ee;border:1px solid #3a3a40\" style-hover=\"border-color:#9696ee\">{{ bytesLabel }}<\u002Fbutton><\u002Fdiv>\n      <sc-if value=\"{{ showBytes }}\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#0d0d0f;border:1px solid #26262b\"><span style=\"color:#5f5e58\">canonical bytes · {{ byteLen }} B · UTF-8<\u002Fspan><span style=\"color:#cfcec8;line-height:1.6;word-break:break-all\">{{ bytes }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-reveal=\"1\" id=\"about\" data-screen-label=\"About\" style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">01 — About<\u002Fdiv>\n    <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.08;letter-spacing:-0.02em;margin:0\">Engineer first.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:28px;max-width:720px\">\n    <p style=\"font-size:clamp(19px,1.7vw,22px);line-height:1.5;margin:0;text-wrap:pretty\">I’m a software developer based in Falun, Sweden. I work at 3stepIT Group, and before that I was a developer at LeaseCloud, building leasing and payment software.<\u002Fp>\n    <p style=\"margin:0;color:#b9b8b2;text-wrap:pretty\">In 2026 I founded Janbjer Technologies AB to build INTYGA. It started from a gap I kept running into: pipelines, scripts and AI agents act on credentials that were valid, doing things nobody specifically agreed to. The credential answers who may act. It says nothing about who decided this particular thing should happen.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:0;border:1px solid #26262b\">\n      <div style=\"flex:1 1 180px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #26262b\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#77766f\">Earlier<\u002Fspan><span style=\"font-weight:600\">LeaseCloud<\u002Fspan><span style=\"font-size:14px;color:#a3a29c\">Developer<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1 1 180px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #26262b\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#77766f\">Now<\u002Fspan><span style=\"font-weight:600\">3stepIT Group<\u002Fspan><span style=\"font-size:14px;color:#a3a29c\">Software<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1 1 180px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;background:rgba(81,81,205,0.12)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9696ee\">2026 →<\u002Fspan><span style=\"font-weight:600\">INTYGA<\u002Fspan><span style=\"font-size:14px;color:#a3a29c\">Founder &amp; Lead Architect<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-reveal=\"1\" id=\"intyga\" data-screen-label=\"INTYGA\" style=\"display:flex;flex-direction:column;gap:clamp(32px,5vw,56px);padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px)\">\n    <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">02 — What I build<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.08;letter-spacing:-0.02em;margin:0\">INTYGA<\u002Fh2>\n      <p style=\"margin:0;color:#a3a29c;font-size:15px\">Swedish for “to certify”. <a href=\"https://www.intyga.com\">intyga.com ↗<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:720px\">\n      <p style=\"font-size:clamp(22px,2.2vw,30px);font-family:'Newsreader',Georgia,serif;line-height:1.3;margin:0;text-wrap:pretty\">MFA proves who signed in. <span style=\"color:#9696ee\">INTYGA proves who approved what.<\u002Fspan><\u002Fp>\n      <p style=\"margin:0;color:#b9b8b2;text-wrap:pretty\">It holds an irreversible action until a named person signs its exact parameters with a passkey. Your service — the one holding the execution credential — verifies that receipt against approver keys it already trusts, then consumes it once and acts. INTYGA holds no key that can approve anything.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n    <sc-for list=\"{{ stepPairs }}\" as=\"pair\" hint-placeholder-count=\"2\"><div style=\"flex:1 1 380px;min-width:0;display:flex;flex-wrap:wrap;gap:12px\">\n    <sc-for list=\"{{ pair.items }}\" as=\"s\" hint-placeholder-count=\"2\">\n      <div style=\"flex:1 1 180px;min-width:0;position:relative;display:flex;flex-direction:column;gap:14px;padding:22px 20px 24px;background:#141417;border:1px solid {{ s.border }};transition:border-color .4s\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:500;color:#9696ee;letter-spacing:-0.02em\">{{ s.n }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#77766f;border:1px solid #2c2c32;padding:3px 8px\">{{ s.who }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:2px;background:#26262b;position:relative\"><div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ s.w }};transition:{{ s.tr }};background:#5151cd\"><sc-if value=\"{{ s.active }}\"><span style=\"position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#9696ee;box-shadow:0 0 12px 2px rgba(81,81,205,0.9)\"><\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-weight:600;font-size:18px\">{{ s.title }}<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:#a3a29c;text-wrap:pretty\">{{ s.body }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#77766f;margin-right:6px\">USED FOR<\u002Fspan>\n    <span style=\"font-size:14px;padding:6px 12px;background:#18181c;border:1px solid #26262b\">AI agent tool calls<\u002Fspan>\n    <span style=\"font-size:14px;padding:6px 12px;background:#18181c;border:1px solid #26262b\">CI/CD deploys<\u002Fspan>\n    <span style=\"font-size:14px;padding:6px 12px;background:#18181c;border:1px solid #26262b\">Package publishing<\u002Fspan>\n    <span style=\"font-size:14px;padding:6px 12px;background:#18181c;border:1px solid #26262b\">Production operations<\u002Fspan>\n    <span style=\"font-size:14px;padding:6px 12px;background:#18181c;border:1px solid #26262b\">Payments<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-reveal=\"1\" id=\"protocols\" data-screen-label=\"Protocols\" style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">03 — Protocols<\u002Fdiv>\n    <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.08;letter-spacing:-0.02em;margin:0\">Published so you can implement them.<\u002Fh2>\n    <p style=\"margin:8px 0 0;font-size:15px;color:#a3a29c\">Open-source verifiers in TypeScript, Go, Rust, Java and Python.<\u002Fp>\n    <p style=\"margin:0;font-size:15px\"><a href=\"https://www.intyga.com/specs\">Specifications ↗<\u002Fa> · <a href=\"https://www.intyga.com/whitepaper\">Whitepaper ↗<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n  <div style=\"flex:2 1 420px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n\n    <div style=\"display:flex;flex-direction:column;background:#141417;border:1px solid #26262b\">\n      <div style=\"padding:22px 22px 0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;letter-spacing:-0.02em\">DIV<\u002Fdiv>\n        <p style=\"margin:0;color:#b9b8b2;font-size:15.5px;text-wrap:pretty\">Binds an approval to one exact action — including the approval requirement itself, so a 1-of-1 receipt can’t pass as 2-of-2.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin:22px;padding:18px;border:1px dashed #3a3a40;display:flex;flex-direction:column;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12.5px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <span style=\"padding:4px 8px;background:#1d1d22;color:#8fb4d9\">target<\u002Fspan><span style=\"padding:4px 8px;background:#1d1d22;color:#8fb4d9\">params<\u002Fspan><span style=\"padding:4px 8px;background:#1d1d22;color:#8fb4d9\">nonce<\u002Fspan><span style=\"padding:4px 8px;background:#1d1d22;color:#8fb4d9\">expiresAt<\u002Fspan><span style=\"padding:4px 8px;background:#1d1d22;color:#8fb4d9\">display<\u002Fspan><span style=\"padding:4px 8px;background:#1d1d22;color:#8fb4d9\">requirement<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"color:#77766f;padding-left:4px\">↓ JCS · RFC 8785<\u002Fdiv>\n        <div style=\"padding:8px 10px;border:1px solid rgba(150,150,238,0.5);color:#9696ee\">ES256 signature · approver’s passkey<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;background:#141417;border:1px solid #26262b\">\n      <div style=\"padding:22px 22px 0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;letter-spacing:-0.02em\">DEWP<\u002Fdiv>\n        <p style=\"margin:0;color:#b9b8b2;font-size:15.5px;text-wrap:pretty\">Makes the approval record auditable by someone who doesn’t trust the vendor: Merkle checkpoints anchored to independent witnesses.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin:22px;padding:18px 12px;border:1px dashed #3a3a40;display:flex;flex-direction:column;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px\">\n        <div style=\"display:flex;gap:8px\"><span style=\"padding:4px 8px;border:1px solid #3a3a40;color:#a3a29c\">Rekor<\u002Fspan><span style=\"padding:4px 8px;border:1px solid #3a3a40;color:#a3a29c\">RFC 3161<\u002Fspan><\u002Fdiv>\n        <div style=\"width:1px;height:14px;background:#3a3a40\"><\u002Fdiv>\n        <div style=\"padding:5px 12px;background:#5151cd;color:#fafafa;font-weight:500\">root<\u002Fdiv>\n        <div style=\"width:1px;height:10px;background:#3a3a40\"><\u002Fdiv>\n        <div style=\"width:50%;height:10px;border:1px solid #3a3a40;border-bottom:none\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-around;width:100%\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;flex:1\">\n            <span style=\"padding:4px 8px;background:#1d1d22;color:#cfcec8\">h₁₂<\u002Fspan>\n            <div style=\"width:1px;height:8px;background:#3a3a40\"><\u002Fdiv>\n            <div style=\"width:50%;height:8px;border:1px solid #3a3a40;border-bottom:none\"><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-around;width:100%\"><span style=\"padding:3px 6px;background:#1d1d22;color:#77766f\">e₁<\u002Fspan><span style=\"padding:3px 6px;background:#1d1d22;color:#77766f\">e₂<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;flex:1\">\n            <span style=\"padding:4px 8px;background:#1d1d22;color:#cfcec8\">h₃₄<\u002Fspan>\n            <div style=\"width:1px;height:8px;background:#3a3a40\"><\u002Fdiv>\n            <div style=\"width:50%;height:8px;border:1px solid #3a3a40;border-bottom:none\"><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-around;width:100%\"><span style=\"padding:3px 6px;background:#1d1d22;color:#77766f\">e₃<\u002Fspan><span style=\"padding:3px 6px;background:#1d1d22;color:#77766f\">e₄<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-reveal=\"1\" data-screen-label=\"Principles\" style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">04 — How I work<\u002Fdiv>\n    <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.08;letter-spacing:-0.02em;margin:0\">Precise over loud.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"flex:2 1 420px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1px;background:#26262b;border:1px solid #26262b\">\n    <div style=\"background:#0d0d0f;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'Newsreader',Georgia,serif;font-size:32px;color:#9696ee;line-height:1\">i.<\u002Fspan><strong style=\"font-weight:600;font-size:18px\">Build one narrow thing.<\u002Fstrong><span style=\"color:#a3a29c;font-size:15px\">No identity, no access management, no deciding whether an action is safe. Others do those well.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#0d0d0f;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'Newsreader',Georgia,serif;font-size:32px;color:#9696ee;line-height:1\">ii.<\u002Fspan><strong style=\"font-weight:600;font-size:18px\">Make trust unnecessary.<\u002Fstrong><span style=\"color:#a3a29c;font-size:15px\">If the vendor can’t hold the key, the vendor can’t forge the approval.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#0d0d0f;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'Newsreader',Georgia,serif;font-size:32px;color:#9696ee;line-height:1\">iii.<\u002Fspan><strong style=\"font-weight:600;font-size:18px\">Keep the verifier readable.<\u002Fstrong><span style=\"color:#a3a29c;font-size:15px\">Small and dependency-free enough to check in an afternoon.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#0d0d0f;padding:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font-family:'Newsreader',Georgia,serif;font-size:32px;color:#9696ee;line-height:1\">iv.<\u002Fspan><strong style=\"font-weight:600;font-size:18px\">State the limits first.<\u002Fstrong><span style=\"color:#a3a29c;font-size:15px\">A signature proves who authorized, never that they understood.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-reveal=\"1\" id=\"skills\" data-screen-label=\"Skills\" style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">05 — Skills<\u002Fdiv>\n    <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.08;letter-spacing:-0.02em;margin:0\">Stack &amp; specialties.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"flex:2 1 420px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n    <sc-for list=\"{{ skills }}\" as=\"g\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;padding:20px;background:#141417;border:1px solid #26262b\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><span style=\"font-weight:600;font-size:16px\">{{ g.title }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#77766f\">{{ g.code }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px\">\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"5\"><span style=\"padding:4px 9px;background:#1d1d22;color:#cfcec8\">{{ it }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"writing\" data-reveal=\"1\" data-screen-label=\"Writing\" style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">06 — Writing<\u002Fdiv>\n    <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:1.08;letter-spacing:-0.02em;margin:0\">Notes on proving a human authorized something.<\u002Fh2>\n    <p style=\"margin:0;font-size:15px\"><a href=\"https://www.intyga.com/blog\">All posts on the INTYGA blog ↗<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n  <div style=\"flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n    <a href=\"https://www.intyga.com/blog/make-trust-unnecessary\" style=\"text-decoration:none;display:flex;flex-direction:column;gap:14px;padding:28px;background:#141417;border:1px solid #26262b;position:relative\" style-hover=\"border-color:#5151cd\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase\"><span style=\"color:#9696ee\">Featured<\u002Fspan><span style=\"color:#77766f\">Sep 23, 2026<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'Newsreader',Georgia,serif;font-size:clamp(28px,3vw,38px);line-height:1.1;letter-spacing:-0.015em\">Make trust unnecessary<\u002Fdiv>\n      <div style=\"color:#b9b8b2;max-width:36em;text-wrap:pretty\">Let agents prepare the work. Require a human signature for the exact payment, permission change or production release before the system executes it.<\u002Fdiv>\n      <div style=\"font-size:15px;font-weight:500;color:#9696ee\">Read the post →<\u002Fdiv>\n    <\u002Fa>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1px;background:#26262b;border:1px solid #26262b\">\n      <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <a href=\"{{ p.href }}\" style=\"text-decoration:none;background:#0d0d0f;padding:20px;display:flex;flex-direction:column;gap:10px\" style-hover=\"background:#141417\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#77766f\">{{ p.date }}<\u002Fspan>\n          <span style=\"font-weight:600;font-size:16px;line-height:1.35;text-wrap:pretty\">{{ p.title }}<\u002Fspan>\n          <span style=\"font-size:14px;color:#a3a29c;text-wrap:pretty\">{{ p.blurb }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-reveal=\"1\" data-screen-label=\"Contact\" style=\"padding:clamp(56px,8vw,96px) 0;border-top:1px solid #26262b\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,56px);align-items:center;padding:clamp(28px,5vw,56px);background:#141417;border:1px solid #2c2c32;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px circle at 100% 0%,rgba(81,81,205,0.22),transparent 60%)\"><\u002Fdiv>\n    <div style=\"position:relative;flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9696ee\">Talk to me about<\u002Fdiv>\n      <h2 style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(34px,4.4vw,60px);line-height:1.04;letter-spacing:-0.02em;margin:0;text-wrap:balance\">Security architecture, questions welcome.<\u002Fh2>\n      <p style=\"margin:0;color:#b9b8b2;max-width:36em;text-wrap:pretty\">Thinking about how an agent, pipeline or script could reach production without a human decision? Happy to discuss approval design, credentials that route around it, or anything in the specs and posts. Send a question.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"font-size:14px;padding:6px 12px;background:#0d0d0f;border:1px solid #2c2c32\">AI agent access &amp; MCP<\u002Fspan>\n        <span style=\"font-size:14px;padding:6px 12px;background:#0d0d0f;border:1px solid #2c2c32\">CI/CD &amp; deploy gates<\u002Fspan>\n        <span style=\"font-size:14px;padding:6px 12px;background:#0d0d0f;border:1px solid #2c2c32\">Approval &amp; audit design<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:
